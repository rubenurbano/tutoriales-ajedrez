<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruben Sbarsky Ajedrez — Tutoriales</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #141b2d;
    --accent: #6ea8fe;
    --text: #e8ecf4;
    --muted: #9aa4b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #182238, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 0.25rem;
    text-align: center;
  }
  .author {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.9rem;
    margin-bottom: 3rem;
  }
  .grid {
    display: grid;
    gap: 1.25rem;
    width: 100%;
    max-width: 720px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  a.card {
    background: var(--card);
    border: 1px solid #232d45;
    border-radius: 16px;
    padding: 1.75rem;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .card h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .tag {
    align-self: flex-start;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1>Ruben Sbarsky Ajedrez</h1>
  <p class="author">By: Ruben Sbarsky</p>

  <div class="grid">
    <a class="card" href="la-defensa-francesa.html">
      <span class="tag">Tutorial</span>
      <h2>La Defensa Francesa by Rubén Sbarsky</h2>
      <p>Tutorial interactivo sobre la Defensa Francesa en ajedrez.</p>
    </a>
  </div>
</body>
</html>
